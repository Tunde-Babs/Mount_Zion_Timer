name: E2E Tests

# Playwright suite for Platform Timer (webapp/e2e). Runs against a local
# `wrangler pages dev` + Vite stack (the same "staging" target used locally,
# never production) with Stripe TEST MODE credentials, so the payment suite
# never touches real money.
#
# Nightly run covers everything, including the Stripe checkout suite (requires
# `stripe listen` running alongside, which this workflow starts itself and
# captures the webhook signing secret from — see the "Start stripe listen" step).
# Manual runs (Actions → E2E Tests → Run workflow) do the same, on demand.
#
# Publishes an Allure report (with history/trends across runs) to GitHub Pages.

on:
  schedule:
    - cron: '0 6 * * *' # nightly at 06:00 UTC — adjust to taste
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp

jobs:
  test:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Stripe CLI
        run: npm install -g @stripe/cli

      # `stripe listen` mints its own webhook signing secret per CLI session —
      # it won't match whatever's saved locally in .dev.vars, so this captures
      # the real one for THIS run rather than relying on a fixed GitHub secret.
      - name: Start `stripe listen` and capture its webhook secret
        run: |
          stripe listen \
            --api-key "${{ secrets.STRIPE_SECRET_KEY }}" \
            --forward-to localhost:8788/api/stripe-webhook \
            > stripe-listen.log 2>&1 &
          echo "Waiting for stripe listen to print its webhook secret…"
          for i in $(seq 1 30); do
            SECRET=$(grep -o 'whsec_[A-Za-z0-9]*' stripe-listen.log | head -1 || true)
            [ -n "$SECRET" ] && break
            sleep 1
          done
          if [ -z "$SECRET" ]; then
            echo "::error::stripe listen never printed a webhook secret — see stripe-listen.log"
            cat stripe-listen.log
            exit 1
          fi
          echo "STRIPE_WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"

      # wrangler pages dev reads secrets from .dev.vars, not process.env — this
      # file is gitignored locally and never committed, so CI reconstructs it
      # from repo secrets (plus the webhook secret captured above).
      - name: Write .dev.vars from secrets
        run: |
          cat > .dev.vars <<EOF
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID=${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET=${{ env.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}
          EOF

      # Separate from .dev.vars: these are frontend/build-time vars Vite reads
      # (VITE_ prefix), not backend secrets — without this, AuthContext's
      # `enabled` flag is false, the login form never renders, and every
      # payment test's login step hangs waiting for a field that never appears.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL=/api
          VITE_FREE_TIMER_LIMIT=5
          VITE_UPGRADE_PRICE_LABEL=€20
          EOF

      - name: Start dev:full (wrangler pages dev + Vite) on :8788
        run: |
          npm run dev:full > dev-full.log 2>&1 &
          echo "Waiting for :8788…"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8788 > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8788 > /dev/null || {
            echo "::error::dev:full never came up on :8788 — see dev-full.log"
            cat dev-full.log
            exit 1
          }

      - name: Run e2e suite
        run: npx playwright test

      # Deliberately NOT uploading dev-full.log / stripe-listen.log as artifacts:
      # this repo is public, so any Actions artifact is publicly downloadable —
      # GitHub's secret masking only scrubs the live log viewer, not the raw
      # bytes of an uploaded file, and either log could plausibly contain
      # STRIPE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY in a stack trace/debug
      # dump. Re-run with tmate (or check the step's live log) if debugging
      # a failure needs them.

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: webapp/allure-results
          retention-days: 7

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/playwright-report
          retention-days: 7

  report:
    name: Allure report
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: webapp/allure-results

      - name: Restore history from gh-pages (if any)
        run: |
          if git clone --single-branch --branch gh-pages --depth 1 \
               "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
               "$GITHUB_WORKSPACE/gh-pages-prev" 2>/dev/null; then
            [ -d "$GITHUB_WORKSPACE/gh-pages-prev/history" ] \
              && cp -r "$GITHUB_WORKSPACE/gh-pages-prev/history" allure-results/history || true
            echo "Restored previous Allure history for trends."
          else
            echo "No gh-pages branch yet — starting fresh history."
          fi

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Upload Allure report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: webapp/allure-report
          retention-days: 30

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: webapp/allure-report

      - name: Link to Allure report
        if: ${{ !cancelled() }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/"
          {
            echo "## 📊 Allure Report"
            echo ""
            echo "✅ Published to GitHub Pages:"
            echo ""
            echo "### 👉 [$PAGES_URL]($PAGES_URL)"
            echo ""
            echo "_(Pages may take ~1 min to rebuild after this run.)_"
          } >> "$GITHUB_STEP_SUMMARY"
